[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfetch"
version = "0.1.0"
description = "A simple and beautiful CLI YouTube downloader"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "yt-dlp>=2025.01.01",
    "typer>=0.16.0",
]

[project.scripts]
pyfetch = "pyfetch.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

